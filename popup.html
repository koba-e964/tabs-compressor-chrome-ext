<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Window Tabs JSON</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Window Tabs JSON</h1>

      <div class="actions">
        <button id="btn-specific" type="button">urls を取得 & コピー</button>
      </div>

      <label for="jsonInput">Restore JSON</label>
      <textarea
        id="jsonInput"
        rows="6"
        placeholder='{"urls":["https://example.com"]}'
      ></textarea>
      <div class="actions">
        <button id="btn-restore-current" type="button">urls を復元</button>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
      <label for="output">URLs JSON</label>
      <textarea id="output" rows="8" readonly aria-live="polite"></textarea>
      <div class="actions">
        <button id="btn-copy" type="button">Copy</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
